# CI：PR / main 推送时自动跑全量单元测试
# 知识库 eval（104 题）需要真实 API key，不在 CI 运行，由维护者本地跑
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1：SQLite 后端（原有行为，零配置）
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 测验模块强制 mock LLM，保证 CI 不访问任何外部服务
      QUIZ_MOCK_LLM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -q

  # Job 2：PostgreSQL 后端（真起一个 PG 16，跑参数化 PG 用例）
  pytest-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUIZ_MOCK_LLM: "1"
      LSX_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/lsx_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lsx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests (PostgreSQL backend)
        run: |
          cd backend
          pytest tests/ -q