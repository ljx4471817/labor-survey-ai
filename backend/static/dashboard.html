<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="/static/theme.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>反馈看板 · 劳动力调查 AI 助手</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--paper);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  padding: 0 0 60px;
}
header {
  background: var(--ink-blue);
  color: var(--paper);
  padding: 16px 20px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(30, 58, 95, 0.18);
}
header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.04em; }
header .back { font-size: 0.82rem; opacity: 0.8; text-decoration: none; color: var(--paper); margin-left: auto; }
header .back:hover { opacity: 1; }

.banner {
  background: #fff3e0;
  color: #6d4520;
  padding: 8px 20px;
  font-size: 0.82rem;
  border-bottom: 1px solid var(--line);
}

main { max-width: 960px; margin: 0 auto; padding: 20px; }

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
}
.card .label { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 4px; }
.card .value { font-size: 1.6rem; font-weight: 600; color: var(--ink-blue); }
.card.rate .value { color: var(--good); }
.card.rate.low .value { color: var(--bad); }

section { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
section h2 { font-size: 1rem; color: var(--ink-blue); margin-bottom: 12px; font-weight: 600; }
section h2 .h2-sub { font-size: 0.78rem; color: var(--text-dim); font-weight: normal; }
section .empty { color: var(--text-dim); font-size: 0.88rem; padding: 8px 0; }

.candidate {
  border-left: 4px solid var(--accent);
  background: var(--accent-soft);
  padding: 12px 14px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 10px;
}
.candidate .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.candidate .tag { background: var(--accent); color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.05em; }
.candidate .freq { font-size: 0.78rem; color: var(--text-dim); }
.candidate .key { font-weight: 600; color: var(--ink-blue); font-size: 0.95rem; word-break: break-all; }
.candidate .comments { margin-top: 6px; font-size: 0.85rem; color: var(--text-dim); padding-left: 14px; }
.candidate .comments li { margin: 2px 0; }
.candidate .actions { margin-top: 8px; display: flex; gap: 8px; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper-dim);
}
.row .count {
  flex-shrink: 0;
  background: var(--bad);
  color: white;
  font-weight: 600;
  font-size: 0.85rem;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.row .body { flex: 1; min-width: 0; }
.row .q { font-weight: 500; color: var(--ink-blue); word-break: break-word; }
.row .meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

.chart { display: flex; gap: 6px; align-items: flex-end; height: 140px; padding: 8px 0; overflow-x: auto; }
.chart .bar-group { flex: 0 0 auto; min-width: 50px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.chart .bars { display: flex; gap: 2px; align-items: flex-end; height: 100px; }
.chart .bar { width: 14px; border-radius: 2px 2px 0 0; }
.chart .bar.good { background: var(--good); }
.chart .bar.bad { background: var(--bad); }
.chart .day { font-size: 0.7rem; color: var(--text-dim); writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.chart-empty { color: var(--text-dim); font-size: 0.85rem; padding: 12px 0; }

.recent-item {
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 8px;
  background: var(--paper-dim);
  transition: opacity 0.3s;
}
.recent-item.resolved { opacity: 0.45; text-decoration: line-through; background: #e5e5e5; }
.recent-item .head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.recent-item .id { font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; color: var(--text-dim); }
.recent-item .ts { font-size: 0.75rem; color: var(--text-dim); }
.recent-item .q { font-size: 0.92rem; color: var(--ink-blue); font-weight: 500; margin-bottom: 4px; }
.recent-item .a { font-size: 0.85rem; color: var(--text); white-space: pre-wrap; max-height: 100px; overflow: auto; padding: 6px 8px; background: white; border-radius: 4px; border: 1px solid var(--line); }
.recent-item .c { font-size: 0.82rem; color: var(--bad); margin-top: 6px; }
.recent-item .actions { margin-top: 8px; }

button {
  font-family: inherit;
  font-size: 0.82rem;
  padding: 5px 12px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: white;
  color: var(--ink-blue);
  cursor: pointer;
  transition: all 0.15s;
}
button:hover { background: var(--ink-blue); color: white; border-color: var(--ink-blue); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--ink-blue); color: white; border-color: var(--ink-blue); }
button.primary:hover { background: var(--ink-blue-soft); }

.pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; }
.pagination .info { font-size: 0.85rem; color: var(--text-dim); }

.review-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.review-tab {
  font-family: inherit; font-size: 0.82rem; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--paper-dim); color: var(--text-dim); cursor: pointer;
}
.review-tab.active { background: var(--ink-blue); border-color: var(--ink-blue); color: white; font-weight: 600; }
.review-status { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.review-status.pending { background: var(--accent-soft); color: var(--accent); }
.review-status.accepted { background: #e8f5ee; color: var(--good); }
.review-status.rejected { background: var(--bad-soft); color: var(--bad); }
.suggestion-item { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
.suggestion-item .who { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 4px 12px; font-size: 0.78rem; color: var(--text-dim); margin-top: 6px; }
.suggestion-item .who b { color: var(--text); font-weight: 600; margin-right: 4px; }
.suggestion-item .block-label { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); margin: 8px 0 3px; }
.suggestion-item .text-block { white-space: pre-wrap; background: white; border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 180px; overflow: auto; }
.suggestion-item .review-history { margin-top: 8px; font-size: 0.76rem; color: var(--text-dim); }
.candidate .toggle-btn { margin-left: auto; }

.error {
  background: var(--bad-soft);
  color: var(--bad);
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 16px;
}

footer {
  text-align: center;
  font-size: 0.78rem;
  color: var(--text-dim);
  padding: 20px;
}

.rate-null { color: var(--text-dim); font-style: italic; }
.rate-good { color: var(--good); font-weight: 600; }
.rate-mid { color: var(--accent); font-weight: 600; }
.rate-bad { color: var(--bad); font-weight: 600; }

.tab-bar {
  display: flex; gap: 0; margin-bottom: 20px;
  border-bottom: 2px solid var(--line);
}
.tab-btn {
  font-family: inherit; font-size: 0.9rem; padding: 10px 24px;
  border: none; background: none; color: var(--text-dim); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--ink-blue); }
.tab-btn.active { color: var(--ink-blue); border-bottom-color: var(--ink-blue); font-weight: 600; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.usage-filters {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  margin-bottom: 16px;
}
.usage-filters .field { display: flex; flex-direction: column; gap: 3px; }
.usage-filters .field label { font-size: 0.75rem; color: var(--text-dim); }
.usage-filters .field input {
  font-family: inherit; font-size: 0.82rem; padding: 6px 8px;
  border: 1px solid var(--line); border-radius: 4px; width: 110px;
}
.usage-filters .field input:focus { outline: none; border-color: var(--ink-blue); }
.usage-filters .actions { display: flex; gap: 6px; align-items: flex-end; padding-bottom: 1px; }

.usage-table { width: 100%; border-collapse: collapse; }
.usage-table th, .usage-table td {
  text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
  font-size: 0.82rem; white-space: nowrap;
}
.usage-table th { color: var(--text-dim); font-weight: 600; font-size: 0.75rem; background: var(--paper-dim); }
.usage-table tbody tr.main-row { cursor: pointer; }
.usage-table tbody tr.main-row:hover { background: var(--accent-soft); }
.usage-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.usage-result-info { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 10px; }
/* 详情展开行（省/市/县/乡/社区） */
.usage-table tr.detail-row { display: none; }
.usage-table tr.detail-row.open { display: table-row; }
.usage-table tr.detail-row td { background: #fafbfc; white-space: normal; }
.usage-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 16px; font-size: 0.78rem; color: var(--text-dim); }
.usage-detail-grid .item b { color: var(--text); font-weight: 600; margin-right: 4px; }
/* 分页 */
.usage-pager { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 0.82rem; color: var(--text-dim); flex-wrap: wrap; }
.usage-pager button { font-family: inherit; font-size: 0.8rem; padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink-blue); cursor: pointer; }
.usage-pager button:disabled { opacity: 0.4; cursor: not-allowed; }
/* 窄屏：卡片式列表 */
@media (max-width: 768px) {
  .usage-table, .usage-table thead, .usage-table tbody, .usage-table tr, .usage-table td { display: block; }
  .usage-table thead { display: none; }
  .usage-table tbody tr { background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; padding: 10px 12px; }
  .usage-table td { border: none; padding: 3px 0; white-space: normal; }
  .usage-table td::before { content: attr(data-label); display: inline-block; min-width: 56px; color: var(--text-dim); font-size: 0.72rem; margin-right: 8px; }
  .usage-table td[data-label=""]::before, .usage-table td:first-child::before { content: none; }
  .usage-table tr.detail-row { display: none; padding: 0; border: none; background: transparent; }
  .usage-table tr.detail-row.open { display: block; padding: 0 4px 8px; }
  .usage-table tr.detail-row td { background: transparent; padding: 0; }
}


/* ============ module hierarchy upgrade ============ */

/* sub-card: generic list row */
.row {
  background: var(--c-bg-elev);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.row:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  box-shadow: 0 6px 18px rgba(2, 40, 90, 0.12);
}
.row .count {
  background: linear-gradient(135deg, var(--bad), #e07070);
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(181, 69, 69, 0.28);
}
.row .q { font-weight: 600; color: var(--ink-blue); }
.row .meta {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  color: var(--text-dim);
  font-size: 0.78rem;
}
.row .meta ul { margin: 4px 0 0; padding-left: 16px; }
.row .actions { margin-top: 8px; }

/* sub-card: KB candidate */
.candidate {
  background: var(--c-bg-elev);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.candidate:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  box-shadow: 0 6px 18px rgba(2, 40, 90, 0.12);
}
.candidate .head { align-items: center; }
.candidate .tag {
  border-radius: 999px;
  padding: 3px 10px;
  background: linear-gradient(135deg, var(--accent), #e2955e);
  box-shadow: 0 2px 6px rgba(201, 122, 58, 0.3);
}
.candidate .key { margin-top: 6px; }
.candidate .comments {
  margin-top: 8px;
  border-left: 2px solid var(--line);
  padding-left: 12px;
}
.candidate .comments ul { margin: 4px 0 0; padding-left: 16px; }

/* sub-card: recent down detail */
.recent-item {
  background: var(--c-bg-elev);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  transition: opacity 0.3s, box-shadow var(--t-fast) var(--ease);
}
.recent-item:hover { box-shadow: 0 6px 18px rgba(2, 40, 90, 0.12); }
.recent-item .head { border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.recent-item .a { background: var(--paper-dim); border: none; }
.recent-item.resolved { opacity: 0.45; text-decoration: line-through; background: var(--paper-dim); }

/* empty placeholder */
.list .empty,
.empty {
  background: var(--paper-dim);
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 18px;
  color: var(--text-dim);
  text-align: center;
}

/* usage table hover */




/* ============ TailAdmin/Tabler style (KB tab): white cards + slim accent bars ============ */
/* modules: white card, 1px border, soft shadow, continuous left accent bar */
#tab-kb > section {
  position: relative;
  background: #FFFFFF;
  border: 1px solid #CBD5E1;
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 2px 6px rgba(15,23,42,.06), 0 10px 24px rgba(15,23,42,.09);
  color: #334155;
}
#tab-kb > section::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  z-index: 1;
  border-radius: 10px 0 0 10px;
  background: #94A3B8;
}
#tab-kb > section:nth-child(1)::before { background: #E2955E; }
#tab-kb > section:nth-child(2)::before { background: #5B8FD4; }
#tab-kb > section:nth-child(3)::before { background: #3FA99B; }
#tab-kb > section:nth-child(4)::before { background: #94A3B8; }

/* module header strip: slate-50 bar + dark slate title */
#tab-kb section h2 {
  position: relative;
  margin: -16px -20px 14px;
  padding: 12px 20px;
  background: #F1F5F9;
  border-bottom: 1px solid #D7DFEA;
  border-radius: 8px 8px 0 0;
  color: #0F172A;
  font-size: 0.95rem;
}
#tab-kb section h2 .h2-sub { color: #64748B; }

/* sub-cards: slate-50 panels on white card for inner hierarchy */
#tab-kb .row,
#tab-kb .candidate,
#tab-kb .recent-item {
  background: #F8FAFC;
  border-color: #E2E8F0;
  box-shadow: none;
}
#tab-kb .row:hover,
#tab-kb .candidate:hover {
  border-color: #CBD5E1;
  box-shadow: 0 4px 12px rgba(15,23,42,.08);
}
#tab-kb .row .q,
#tab-kb .candidate .key,
#tab-kb .recent-item .q { color: #0F172A; }
#tab-kb .recent-item .a { color: #334155; }
#tab-kb .row .meta,
#tab-kb .candidate .freq,
#tab-kb .candidate .comments,
#tab-kb .recent-item .id,
#tab-kb .recent-item .ts,
#tab-kb .recent-item .ts { color: #64748B; }

/* dark mode: dark panels, keep slim accent bars */
html[data-theme="dark"] #tab-kb > section { color: var(--c-ink-2); }
html[data-theme="dark"] #tab-kb section h2 {
  background: linear-gradient(90deg, var(--c-bg-tint), transparent);
  border-bottom-color: var(--c-line);
  color: var(--c-ink);
}
html[data-theme="dark"] #tab-kb > section::before { opacity: .85; }
html[data-theme="dark"] #tab-kb .row,
html[data-theme="dark"] #tab-kb .candidate,
html[data-theme="dark"] #tab-kb .recent-item {
  background: var(--c-bg-tint);
  border-color: var(--c-line);
}
html[data-theme="dark"] #tab-kb .row .q,
html[data-theme="dark"] #tab-kb .candidate .key,
html[data-theme="dark"] #tab-kb .recent-item .q { color: var(--c-ink); }
html[data-theme="dark"] #tab-kb .recent-item .a { color: var(--c-ink-2); }
html[data-theme="dark"] #tab-kb section h2 .h2-sub,
html[data-theme="dark"] #tab-kb .row .meta,
html[data-theme="dark"] #tab-kb .candidate .freq,
html[data-theme="dark"] #tab-kb .candidate .comments,
html[data-theme="dark"] #tab-kb .recent-item .id,
html[data-theme="dark"] #tab-kb .recent-item .ts,
html[data-theme="dark"] #tab-kb .recent-item .ts { color: var(--c-ink-3); }

/* dark mode: tinted zones fall back to dark panels, keep the accent bar */
html[data-theme="dark"] #tab-kb > section,
html[data-theme="dark"] #tab-kb > section {
  background: var(--c-bg-elev);
  border-color: var(--c-line);
}
html[data-theme="dark"] #tab-kb > section h2,
html[data-theme="dark"] #tab-kb > section h2 {
  background: linear-gradient(90deg, var(--c-bg-tint), transparent);
  border-bottom-color: var(--c-line);
}


/* white bg: top stat cards + usage sections get soft separation */
main .cards .card { border-color: #CBD5E1; box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.08); }


/* page bg: slate-150 (deeper cool gray -> stronger card separation) */
html body { background: #E9EEF5; }
html body:not(.blue-bg) section h2 { margin: -16px -20px 14px; padding: 12px 20px; }
</style>
</head>
<body>
<header class="admin-header">
  <h1>数据看板</h1>
  <nav class="admin-nav" id="adminNav"></nav>
  <span class="role-tag" id="roleTag">内部使用</span>
  <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<a class="back" href="/">← 返回对话</a>
<button class="logout-btn" type="button" onclick="logout()">退出登录</button>
</header>
<div class="banner">⚠ 内部使用 · 含调查员提问原文 · 数据未脱敏</div>
<main>
  <div id="error"></div>
  <div class="cards" id="feedbackCards">
    <div class="card"><div class="label">总反馈数</div><div class="value" id="total">—</div></div>
    <div class="card"><div class="label">采纳</div><div class="value" id="adopted">—</div></div>
    <div class="card"><div class="label">不采纳</div><div class="value" id="rejected">—</div></div>
    <div class="card rate" id="rateCard"><div class="label">采纳率</div><div class="value" id="rate">—</div></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="kb">KB 优化</button>
    <button class="tab-btn" data-tab="usage">使用监测</button>
  </div>

  <div class="tab-panel active" id="tab-kb">
    <section>
      <h2>KB 改进候选 <span class="h2-sub">（负面反馈修正建议队列）</span></h2>
      <div class="review-tabs" id="reviewTabs">
        <button class="review-tab active" data-status="pending">待处理 0</button>
        <button class="review-tab" data-status="accepted">已采纳 0</button>
        <button class="review-tab" data-status="rejected">不采纳 0</button>
      </div>
      <div id="improvementCandidates"></div>
    </section>
  </div>

  <div class="tab-panel" id="tab-usage">
    <section id="llmRouteSection">
      <h2>&#x5F53;&#x524D;&#x6A21;&#x578B; <span class="h2-sub">&#xFF08;MiniMax &#x4E3B;&#x7528; / qwen-flash &#x5907;&#x7528; / DeepSeek &#x515C;&#x5E95;&#xFF09;</span>
        <button onclick="loadLlmRoute(true)" style="float:right;font-size:0.78rem">&#x5237;&#x65B0;</button></h2>
      <div id="llmRoute"></div>
    </section>

    <section>
      <h2>反馈时间分布 <span class="h2-sub">（UTC+8）</span></h2>
      <div id="chart" class="chart"></div>
    </section>

    <section id="usageSection">
      <h2>使用情况查询</h2>
      <div class="usage-filters">
        <div class="field"><label>省</label><input id="fProvince" placeholder="如 贵州省"></div>
        <div class="field"><label>市/州</label><input id="fCity" placeholder="如 贵阳市"></div>
        <div class="field"><label>县/区</label><input id="fCounty" placeholder="如 云岩区"></div>
        <div class="field"><label>乡/镇</label><input id="fTownship"></div>
        <div class="field"><label>社区/村</label><input id="fCommunity"></div>
        <div class="field"><label>姓名</label><input id="fName" placeholder="模糊匹配"></div>
        <div class="field"><label>手机号</label><input id="fPhone" placeholder="模糊匹配" maxlength="11"></div>
        <div class="actions">
          <button class="primary" id="queryBtn" onclick="searchUsage()">查询</button>
          <button onclick="resetUsageFilters()">重置</button>
        </div>
      </div>
      <div id="usageResult"></div>
    </section>
  </div>

</main>
<footer>劳动力调查 AI 助手 · 反馈看板 v1 · 由 <code>/api/admin/feedback/stats</code> 驱动</footer>

<script src="/static/common.js"></script>
<script>
let state = null;
let reviewStatus = 'pending';

requireLoginOrRedirect();

async function loadStats() {
  try {
    const r = await fetch('/api/admin/feedback/stats', { headers: authHeader() });
    if (await handle401(r)) return;
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    state = await r.json();
    render();
  } catch (e) {
    $('error').innerHTML = `<div class="error">加载失败：${escapeHtml(e.message)}</div>`;
  }
}

function renderSummary() {
  const s = state.summary;
  $('total').textContent = s.total;
  $('adopted').textContent = s.adopted;
  $('rejected').textContent = s.rejected;
  const pct = (s.adoption_rate * 100).toFixed(1) + '%';
  $('rate').textContent = pct;
  $('rateCard').classList.toggle('low', s.adoption_rate < 0.6 && s.total > 0);
}

function renderChart() {
  const data = state.by_day;
  const el = $('chart');
  if (!data.length) {
    el.className = 'chart-empty';
    el.textContent = '暂无数据';
    return;
  }
  el.className = 'chart';
  const maxCount = Math.max(...data.map(d => d.count), 1);
  el.innerHTML = data.slice(-14).map(d => {
    const goodH = (d.adopted / maxCount) * 100;
    const badH = (d.rejected / maxCount) * 100;
    return `
      <div class="bar-group">
        <div class="bars">
          <div class="bar good" style="height:${goodH}%" title="采纳 ${d.adopted}"></div>
          <div class="bar bad" style="height:${badH}%" title="不采纳 ${d.rejected}"></div>
        </div>
        <div class="day">${escapeHtml(d.day.slice(5))}</div>
      </div>`;
  }).join('');
}

const REVIEW_LABELS = { pending: '待处理', accepted: '已采纳', rejected: '不采纳' };

function renderReviewTabs() {
  const counts = state.review_status_counts || { pending: 0, accepted: 0, rejected: 0 };
  document.querySelectorAll('#reviewTabs .review-tab').forEach(button => {
    const status = button.dataset.status;
    button.textContent = `${REVIEW_LABELS[status]} ${counts[status] || 0}`;
    button.classList.toggle('active', status === reviewStatus);
  });
}

function renderReviewHistory(record) {
  const history = record.review?.history || [];
  if (!history.length) return '';
  const items = history.map(event =>
    `<div>${escapeHtml(event.ts || '')} · ${escapeHtml(event.reviewer_name || event.reviewer_phone || '管理员')} · ${REVIEW_LABELS[event.action] || event.action}</div>`
  ).join('');
  return `<details class="review-history"><summary>复核历史</summary>${items}</details>`;
}

function renderSources(record) {
  const sources = record.sources || [];
  if (!sources.length) return '';
  const items = sources.map(s => `<li>${escapeHtml(s.qa_id || '?')} · ${escapeHtml(s.question || '')} · 来源：${escapeHtml(s.source || '?')}</li>`).join('');
  return `<details><summary>参考资料（${sources.length}）</summary><ul>${items}</ul></details>`;
}

function renderSuggestion(record) {
  const status = record.review_status;
  const currentAction = status === 'pending' ? '' : status;
  const region = [
    record.province, record.city, record.county,
    record.township, record.community,
  ].filter(Boolean).join(' / ') || '—';
  return `
    <div class="suggestion-item" data-record-id="${escapeHtml(record.id)}">
      <div class="head">
        <span class="ts">${escapeHtml(record.timestamp || '')}</span>
        <span class="review-status ${status}">${REVIEW_LABELS[status]}</span>
        <span class="toggle-btn">
          <button class="review-btn" data-id="${escapeHtml(record.id)}" data-action="accepted" ${currentAction === 'accepted' ? 'disabled' : ''}>采纳建议</button>
          <button class="review-btn" data-id="${escapeHtml(record.id)}" data-action="rejected" ${currentAction === 'rejected' ? 'disabled' : ''}>不采纳建议</button>
        </span>
      </div>
      <div class="who">
        <div><b>姓名</b>${escapeHtml(record.name || '—')}</div>
        <div><b>手机号</b>${escapeHtml(record.phone || '—')}</div>
        <div><b>区域</b>${escapeHtml(region)}</div>
      </div>
      <div class="block-label">用户问题</div>
      <div class="text-block">${escapeHtml(record.question || '')}</div>
      <div class="block-label">原答案</div>
      <div class="text-block">${escapeHtml(record.answer || '')}</div>
      <div class="block-label">正确答案</div>
      <div class="text-block">${escapeHtml(record.corrected_answer || '')}</div>
      <div class="block-label">依据</div>
      <div class="text-block">${escapeHtml(record.evidence || '')}</div>
      ${renderSources(record)}
      ${renderReviewHistory(record)}
    </div>`;
}

function renderImprovementCandidates() {
  const counts = state.review_status_counts || { pending: 0, accepted: 0, rejected: 0 };
  const all = state.improvement_candidates || [];
  const candidates = all
    .filter(item => (item.status_counts?.[reviewStatus] || 0) > 0)
    .sort((a, b) => String(b.latest_by_status?.[reviewStatus] || '')
      .localeCompare(String(a.latest_by_status?.[reviewStatus] || '')));
  const el = $('improvementCandidates');
  if (!candidates.length) {
    el.innerHTML = `<div class="empty">当前${REVIEW_LABELS[reviewStatus]}反馈为空</div>`;
    return;
  }
  el.innerHTML = candidates.map(item => {
    const records = item.records.filter(record => record.review_status === reviewStatus);
    const display = escapeHtml(item.user_question || item.question || '（无问题文本）');
    const kbCandidate = item.qa_id
      ? `命中候选：qa_id=${escapeHtml(item.qa_id)} · ${escapeHtml(item.question || '')}`
      : '命中候选：无 QA';
    const details = records.map(renderSuggestion).join('');
    return `
      <div class="candidate">
        <div class="head">
          <span class="tag">${REVIEW_LABELS[reviewStatus]}</span>
          <span class="freq">${item.feedback_count} 条反馈 · ${item.user_count} 位用户</span>
        </div>
        <div class="key">${display}</div>
        <div class="comments">${kbCandidate}<br>待处理 ${item.status_counts.pending} · 已采纳 ${item.status_counts.accepted} · 不采纳 ${item.status_counts.rejected}</div>
        <details><summary>展开明细（${records.length}）</summary>${details}</details>
      </div>`;
  }).join('');
}

async function reviewRecord(recordId, action, button) {
  if (button) button.disabled = true;
  try {
    const response = await fetch('/api/admin/feedback/resolve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeader() },
      body: JSON.stringify({ record_id: recordId, action }),
    });
    if (await handle401(response)) return;
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    await loadStats();
  } catch (e) {
    alert('复核失败：' + e.message);
    if (button) button.disabled = false;
  }
}

function render() {
  renderSummary();
  renderChart();
  renderReviewTabs();
  renderImprovementCandidates();
}

document.addEventListener('click', (e) => {
  const reviewTab = e.target.closest('.review-tab');
  if (reviewTab) {
    reviewStatus = reviewTab.dataset.status;
    renderReviewTabs();
    renderImprovementCandidates();
    return;
  }
  const btn = e.target.closest('.review-btn');
  if (btn) {
    reviewRecord(btn.dataset.id, btn.dataset.action, btn);
  }
});

// ---- 角色探测：系统管理员全量；业务管理员只见本区域只读统计 ----
let me = null;
let llmLoaded = false;
initRole();

async function initRole() {
  try {
    const r = await fetch('/api/admin/whitelist/whoami', { headers: authHeader() });
    if (await handle401(r)) return;
    if (r.status === 403) {
      $('error').innerHTML = '<div class="error">无看板权限，即将返回首页</div>';
      setTimeout(() => location.replace('/'), 1200);
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    me = await r.json();
    const sys = me.sys_role === '系统管理员';
    $('feedbackCards').style.display = sys ? '' : 'none';
    $('tab-kb').style.display = sys ? '' : 'none';
    $('llmRouteSection').style.display = sys ? '' : 'none';
    const chartSec = document.querySelector('#tab-usage section:nth-of-type(2)');
    if (chartSec) chartSec.style.display = sys ? '' : 'none';
    document.querySelectorAll('.tab-btn[data-tab="kb"]').forEach(b => b.style.display = sys ? '' : 'none');
    await initAdminNav('dashboard', me);
    if (sys) {
      loadStats();
    } else {
      // 业务管理员（区县）进入数据看板默认显示「使用监测」
      switchTab('usage');
    }
    searchUsage();
    if (sys) loadLlmRoute();
  } catch (e) {
    $('error').innerHTML = '<div class="error">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

async function loadLlmRoute(force) {
  if (llmLoaded && !force) return;
  const el = $('llmRoute');
  try {
    const r = await fetch('/api/admin/llm/route', { headers: authHeader() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    llmLoaded = true;
    const model = d.active_model || d.active_provider || '\u2014';
    let balText = '\u2014';
    let balSub = '\u4f59\u989d\u67e5\u8be2\u4e0d\u53ef\u7528';
    try {
      const br = await fetch('/api/admin/llm/balance', { headers: authHeader() });
      if (br.ok) {
        const b = await br.json();
        if (b.error) {
          balSub = '\u4f59\u989d\u67e5\u8be2\u5931\u8d25';
        } else {
          balText = '\u00a5' + (b.available_amount != null ? b.available_amount : '\u2014');
          balSub = (b.month || '') + ' \u767e\u70bc\u6d88\u8d39 \u00a5' + (b.month_bailian_usage != null ? b.month_bailian_usage : '\u2014');
        }
      }
    } catch (e) {
      balSub = '\u4f59\u989d\u67e5\u8be2\u5931\u8d25';
    }
    const p5 = d.used_5h_pct == null ? '\u2014' : d.used_5h_pct + '%';
    const p7 = d.used_7d_pct == null ? '\u2014' : d.used_7d_pct + '%';
    const bad = d.last_error || (d.consecutive_failures > 0 ? '\u8fde\u7eed\u5931\u8d25' + d.consecutive_failures + '\u6b21' : '');
    const status = bad ? '\u5f02\u5e38' : '\u6b63\u5e38';
    const provider = d.active_provider === 'minimax' ? 'MiniMax \u4e3b\u7528' : (d.active_provider === 'dashscope' ? 'qwen-flash \u5907\u7528' : (d.active_provider === 'deepseek' ? 'DeepSeek \u6700\u540e\u515c\u5e95' : d.active_provider));
    const detail = '\u6700\u8fd1\u68c0\u67e5\uff1a' + (d.last_check_at ? new Date(d.last_check_at * 1000).toLocaleString('zh-CN') : '\u2014')
      + '  \u5207\u6362\u65f6\u95f4\uff1a' + (d.last_switch_at ? new Date(d.last_switch_at * 1000).toLocaleString('zh-CN') : '\u2014')
      + '  ' + provider;
    const manual = d.manual_override;
    let manualHtml = '';
    if (manual) {
      const ml = manual.provider === 'minimax' ? 'MiniMax 主用' : (manual.provider === 'dashscope' ? 'qwen-flash 备用' : 'DeepSeek 兜底');
      manualHtml = '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        + '<span style="background:#fbf1dd;color:#b7791f;border-radius:999px;padding:2px 10px;font-size:.75rem">🔒 已手动锁定：' + escapeHtml(ml) + '</span>'
        + (manual.set_at ? '<span style="color:var(--text-dim);font-size:.75rem">' + new Date(manual.set_at * 1000).toLocaleString('zh-CN') + '</span>' : '')
        + '<button id="llm-auto-btn" style="border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:6px 14px;font-size:.85rem;cursor:pointer">恢复自动</button>'
        + '</div>';
    } else if (d.can_manage) {
      manualHtml = '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        + '<select id="llm-target" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:.85rem;background:#fff">'
        + '<option value="minimax">MiniMax 主用</option><option value="dashscope">qwen-flash 备用</option><option value="deepseek">DeepSeek 兜底</option></select>'
        + '<button id="llm-switch-btn" style="border:none;background:var(--ink-blue);color:#fff;border-radius:6px;padding:6px 14px;font-size:.85rem;cursor:pointer">切换</button>'
        + '<span style="color:var(--text-dim);font-size:.75rem">MiniMax 额度用尽自动切 qwen-flash；qwen-flash 异常再切 DeepSeek</span>'
        + '</div>';
    }
    el.innerHTML = '<div class="cards" style="margin-bottom:8px">'
      + '<div class="card"><div class="label">\u5f53\u524d\u6a21\u578b</div><div class="value" style="font-size:1.05rem;word-break:break-all">' + escapeHtml(model) + '</div></div>'
      + '<div class="card"><div class="label">5h \u7528\u91cf</div><div class="value">' + p5 + '</div></div>'
      + '<div class="card"><div class="label">7d \u7528\u91cf</div><div class="value">' + p7 + '</div></div>'
      + '<div class="card"><div class="label">\u963f\u91cc\u4e91\u4f59\u989d\uff08qwen-flash\uff09</div><div class="value" style="font-size:1.05rem">' + balText + '</div><div style="font-size:.75rem;color:var(--text-dim)">' + balSub + '</div></div>'
      + '<div class="card ' + (bad ? 'rate low' : 'rate') + '"><div class="label">\u72b6\u6001</div><div class="value">' + status + '</div></div>'
      + '</div>'
      + '<div class="usage-result-info">' + escapeHtml(detail)
      + (bad ? '  <span style="color:var(--bad)">' + escapeHtml(bad) + '</span>' : '')
      + '</div>' + manualHtml;
    const switchBtn = document.getElementById('llm-switch-btn');
    if (switchBtn) switchBtn.addEventListener('click', async () => {
      const target = document.getElementById('llm-target').value;
      const res = await fetch('/api/admin/llm/route', { method: 'POST', headers: Object.assign({'Content-Type': 'application/json'}, authHeader()), body: JSON.stringify({ provider: target }) });
      if (await handle401(res)) return;
      if (!res.ok) { let m = '切换失败'; try { const e = await res.json(); if (e.detail) m = e.detail; } catch (x) {} alert(m); return; }
      loadLlmRoute(true);
    });
    const autoBtn = document.getElementById('llm-auto-btn');
    if (autoBtn) autoBtn.addEventListener('click', async () => {
      const res = await fetch('/api/admin/llm/route', { method: 'POST', headers: Object.assign({'Content-Type': 'application/json'}, authHeader()), body: JSON.stringify({ provider: 'auto' }) });
      if (await handle401(res)) return;
      loadLlmRoute(true);
    });
  } catch (e) {
    el.innerHTML = '<div class="empty">\u52a0\u8f7d\u5931\u8d25\uff1a' + escapeHtml(e.message) + '</div>';
  }
}


// ── tab 切换 ─────

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    switchTab(btn.dataset.tab);
    if (btn.dataset.tab === 'usage' && !llmLoaded) loadLlmRoute();
  });
});

// ── 使用情况筛选查询 ─────

function formatRate(rate) {
  if (rate === null || rate === undefined) return '—';
  return (rate * 100).toFixed(1) + '%';
}

function rateClass(rate) {
  if (rate === null || rate === undefined) return 'rate-null';
  if (rate >= 0.8) return 'rate-good';
  if (rate >= 0.5) return 'rate-mid';
  return 'rate-bad';
}

function collectUsageFilters() {
  const p = {};
  const v = $('fProvince').value.trim(); if (v) p.province = v;
  const c = $('fCity').value.trim(); if (c) p.city = c;
  const co = $('fCounty').value.trim(); if (co) p.county = co;
  const t = $('fTownship').value.trim(); if (t) p.township = t;
  const cm = $('fCommunity').value.trim(); if (cm) p.community = cm;
  const n = $('fName').value.trim(); if (n) p.name = n;
  const ph = $('fPhone').value.trim(); if (ph) p.phone = ph;
  return p;
}

let usageAll = [];           // 使用情况查询全量结果（前端分页）
let usagePage = 1;
const usagePageSize = 20;
let usageDetailSet = new Set(); // 详情展开状态

async function searchUsage() {
  const btn = $('queryBtn');
  btn.disabled = true;
  const filters = collectUsageFilters();
  const params = new URLSearchParams(filters);
  try {
    const r = await fetch('/api/admin/usage/search?' + params, { headers: authHeader() });
    if (await handle401(r)) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    usageAll = data.results || [];
    usagePage = 1;
    renderUsageResult();
  } catch (e) {
    $('usageResult').innerHTML = '<div class="empty">查询失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false;
  }
}

function resetUsageFilters() {
  ['fProvince', 'fCity', 'fCounty', 'fTownship', 'fCommunity', 'fName', 'fPhone'].forEach(id => $(id).value = '');
  searchUsage();
}

function renderUsageResult() {
  const el = $('usageResult');
  const total = usageAll.length;
  if (!total) {
    el.innerHTML = '<div class="usage-result-info">共 0 条</div><div class="empty">暂无匹配数据</div>';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(total / usagePageSize));
  if (usagePage > totalPages) usagePage = totalPages;
  const start = (usagePage - 1) * usagePageSize;
  const pageRows = usageAll.slice(start, start + usagePageSize);
  const rows = pageRows.map(r => {
    const fbRate = r.feedback_count > 0 ? r.adopted_count / r.feedback_count : null;
    const region = (r.city || r.province || '') + (r.county ? ' · ' + r.county : '');
    const open = usageDetailSet.has(r.phone) ? ' open' : '';
    const detailItems = [
      ['省', r.province], ['市/州', r.city], ['县/区', r.county],
      ['乡/镇', r.township || ''], ['社区/村', r.community],
    ].map(x => '<span class="item"><b>' + escapeHtml(x[0]) + '</b>' + escapeHtml(x[1]) + '</span>').join('');
    return '<tr class="main-row" onclick="toggleUsageDetail(\'' + escapeHtml(r.phone) + '\')" title="点击展开/收起区域详情">' +
      '<td data-label="手机号">' + escapeHtml(r.phone) + '</td>' +
      '<td data-label="姓名">' + escapeHtml(r.name) + '</td>' +
      '<td data-label="区域">' + escapeHtml(region) + '</td>' +
      '<td data-label="查询次数" class="num">' + r.query_count + '</td>' +
      '<td data-label="最近查询">' + escapeHtml((r.last_query_at || '').slice(0, 16)) + '</td>' +
      '<td data-label="反馈数" class="num">' + r.feedback_count + '</td>' +
      '<td data-label="采用率" class="num ' + rateClass(fbRate) + '">' + formatRate(fbRate) + '</td>' +
      '</tr>' +
      '<tr class="detail-row' + open + '" data-phone="' + escapeHtml(r.phone) + '">' +
        '<td colspan="7"><div class="usage-detail-grid">' + detailItems + '</div></td>' +
      '</tr>';
  }).join('');
  el.innerHTML = '<div class="usage-result-info">共 ' + total + ' 条 · 第 ' + (start + 1) + '–' + (start + pageRows.length) + ' 条</div>' +
    '<table class="usage-table"><thead><tr>' +
    '<th>手机号</th><th>姓名</th><th>区域</th><th>查询次数</th><th>最近查询</th><th>反馈数</th><th>采用率</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="usage-pager">' +
      '<button onclick="usageGoPage(-1)" ' + (usagePage <= 1 ? 'disabled' : '') + '>上一页</button>' +
      '<span>第 ' + usagePage + '/' + totalPages + ' 页</span>' +
      '<button onclick="usageGoPage(1)" ' + (usagePage >= totalPages ? 'disabled' : '') + '>下一页</button>' +
    '</div>';
}

function usageGoPage(delta) {
  usagePage += delta;
  renderUsageResult();
}

function toggleUsageDetail(phone) {
  const tr = document.querySelector('tr.detail-row[data-phone="' + CSS.escape(phone) + '"]');
  if (!tr) return;
  const open = tr.classList.contains('open');
  tr.classList.toggle('open');
  if (open) usageDetailSet.delete(phone); else usageDetailSet.add(phone);
}
</script>
</body>
</html>
