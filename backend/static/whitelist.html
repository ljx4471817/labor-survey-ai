<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="/static/theme.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>白名单管理 · 劳动力调查 AI 助手</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--paper);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  padding: 0 0 60px;
}
header {
  background: var(--ink-blue);
  color: var(--paper);
  padding: 16px 20px;
  display: flex; align-items: baseline; gap: 16px;
  position: sticky; top: 0; z-index: 10;
  box-shadow: 0 2px 8px rgba(30,58,95,0.18);
}
header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.04em; }
header .role-tag { font-size: 0.78rem; background: rgba(255,255,255,0.16); padding: 2px 10px; border-radius: 999px; }
header .back { font-size: 0.82rem; opacity: 0.8; text-decoration: none; color: var(--paper); margin-left: auto; }
header .back:hover { opacity: 1; }

main { max-width: 1200px; margin: 0 auto; padding: 20px; }

.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.tab-bar .tab-btn {
  border: none; border-bottom: 2px solid transparent; border-radius: 0;
  background: transparent; padding: 8px 16px; font-size: 0.9rem; color: var(--text-dim);
}
.tab-bar .tab-btn.active { color: var(--ink-blue); border-bottom-color: var(--ink-blue); font-weight: 600; }

.toolbar {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-bottom: 16px;
}
button {
  font-family: inherit; font-size: 0.82rem; padding: 6px 14px;
  border-radius: 4px; border: 1px solid var(--line); background: white;
  color: var(--ink-blue); cursor: pointer; transition: all 0.15s;
}
button:hover { background: var(--ink-blue); color: white; border-color: var(--ink-blue); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--ink-blue); color: white; border-color: var(--ink-blue); }
button.primary:hover { background: var(--ink-blue-soft); }
button.danger { color: var(--bad); border-color: var(--bad); }
button.danger:hover { background: var(--bad); color: white; }

.table-wrap { overflow-x: auto; background: white; border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: var(--ink-blue); color: var(--paper); font-weight: 600; font-size: 0.78rem; position: sticky; top: 0; }
tr.inactive { background: #f5f5f5; color: var(--text-dim); }
tr.main-row:hover { background: #eef3f7; }
td input[type=checkbox] { cursor: pointer; }

/* 详情展开行（省/市/县/乡/社区/系统职能/更新时间/备注） */
tr.detail-row { display: none; }
tr.detail-row.open { display: table-row; }
tr.detail-row td { background: #fafbfc; padding: 10px 14px; white-space: normal; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px 18px; font-size: 0.78rem; color: var(--text-dim); }
.detail-grid .item b { color: var(--text); font-weight: 600; margin-right: 4px; }

/* 弹窗：高度自适应（矮视口 body 内部滚动，底部不裁剪） */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  z-index: 100; justify-content: center; align-items: flex-start; overflow-y: auto;
  padding: 40px 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  max-width: 520px; width: 100%; margin: 0 auto; overflow: hidden;
  display: flex; flex-direction: column; max-height: calc(100vh - 32px);
}
.modal .head {
  flex: none; background: var(--ink-blue); color: var(--paper);
  padding: 12px 16px; font-weight: 600; font-size: 0.95rem;
  display: flex; justify-content: space-between; align-items: center;
}
.modal .head .close { cursor: pointer; font-size: 1.2rem; opacity: 0.8; }
.modal .body { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal .body label {
  display: block; font-size: 0.8rem; color: var(--text-dim); margin: 8px 0 4px;
}
.modal .body input, .modal .body select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px;
  font-size: 0.88rem; font-family: inherit; background: white;
}
.modal .body input:focus, .modal .body select:focus { outline: none; border-color: var(--ink-blue); }
.modal .foot {
  flex: none; padding: 12px 16px; border-top: 1px solid var(--line);
  display: flex; gap: 8px; justify-content: flex-end;
}

.form-grid { display: grid; gap: 12px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form-row .full { grid-column: 1 / -1; }
.hidden { display: none !important; }
.choice-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px; }
.choice {
  display: flex; align-items: center; gap: 6px; margin: 0 !important;
  border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
  font-size: 0.86rem; color: var(--text); background: white; cursor: pointer;
}
.choice.hidden { display: none; }
.choice input[type=radio] { width: auto; margin: 0; accent-color: var(--ink-blue); }
.choice input[type=radio]:disabled + span { color: var(--text-dim); }
.readonly-box {
  border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
  font-size: 0.88rem; background: var(--paper-dim); color: var(--text);
}
.field-hint { min-height: 18px; margin-top: 4px; font-size: 0.75rem; color: var(--text-dim); }
.field-hint.warn { color: #b45309; }
.region-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.region-grid .field { min-width: 0; }
.search-select { position: relative; }
.search-select input { padding-right: 36px; }
.search-select.legacy input { border-color: #f59e0b; background: #fffbeb; }
.search-toggle {
  position: absolute; right: 2px; top: 2px; width: 30px; height: calc(100% - 4px);
  border: none; border-radius: 3px; background: transparent; color: var(--text-dim);
  padding: 0; font-size: 0.8rem;
}
.search-toggle:hover { background: transparent; color: var(--ink-blue); }
.search-menu {
  display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
  max-height: 210px; overflow-y: auto; background: white; border: 1px solid var(--line);
  border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}
.search-menu.open { display: block; }
.search-option {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px;
  border: none; border-radius: 0; background: white; color: var(--text);
  padding: 8px 10px; text-align: left;
}
.search-option + .search-option { border-top: 1px solid var(--line); }
.search-option:hover, .search-option.active { background: #eef3f7; }
.search-option small { color: var(--text-dim); font-size: 0.72rem; }
.search-empty { padding: 10px; color: var(--text-dim); font-size: 0.82rem; }

/* 窄屏（<=768px）：卡片式列表，无横向滚动 */
@media (max-width: 768px) {
  #panel-list .table-wrap { overflow: visible; border: none; background: transparent; }
  #panel-list table, #panel-list thead, #panel-list tbody, #panel-list tr, #panel-list td { display: block; }
  #panel-list thead { display: none; }
  #tbody tr { background: #fff; border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 10px; padding: 10px 12px; }
  #tbody td { border: none; padding: 3px 0; white-space: normal; }
  #tbody td::before { content: attr(data-label); display: inline-block; min-width: 56px;
    color: var(--text-dim); font-size: 0.72rem; margin-right: 8px; }
  #tbody td[data-label=""]::before, #tbody td:first-child::before { content: none; }
  #tbody tr.detail-row { display: none; padding: 0; border: none; background: transparent; }
  #tbody tr.detail-row.open { display: block; padding: 0 4px 8px; }
  #tbody tr.detail-row td { background: transparent; padding: 0; }
  .detail-grid { grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .form-row, .region-grid { grid-template-columns: 1fr; }
  .modal-overlay { padding: 16px 8px; }
}

.msg { padding: 8px 14px; border-radius: 4px; margin-bottom: 12px; font-size: 0.85rem; }
.msg.ok { background: #e8f5e9; color: var(--good); border: 1px solid #c8e6c9; }
.msg.err { background: var(--bad-soft); color: var(--bad); border: 1px solid #ef9a9a; }

.btn-sm { font-size: 0.75rem; padding: 3px 8px; }

.pager { display: flex; align-items: center; gap: 12px; padding: 10px 4px 0; font-size: 0.82rem; color: var(--text-dim); flex-wrap: wrap; }
.pager select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 0.82rem; font-family: inherit; background: white; }
.pager .pages { display: flex; gap: 4px; align-items: center; margin-left: auto; }
.pager .pages button { min-width: 32px; padding: 4px 8px; }
.pager .pages button.active { background: var(--ink-blue); color: white; border-color: var(--ink-blue); }
.pager .ellipsis { padding: 0 4px; color: var(--text-dim); }
.empty-row { text-align: center; padding: 24px; color: var(--text-dim); font-size: 0.88rem; }

.audit-filter { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.audit-filter input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 0.85rem; width: 220px; max-width: 100%; }

footer {
  text-align: center; font-size: 0.75rem; color: var(--text-dim);
  padding: 20px 0 0;
}
</style>
</head>
<body>
<header class="admin-header">
  <h1>白名单管理</h1>
  <nav class="admin-nav" id="adminNav"></nav>
  <span class="role-tag" id="roleTag">—</span>
  <a class="back" href="/">← 对话</a>
  <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<button class="logout-btn" onclick="logout()">退出登录</button>
</header>
<main>
  <div id="msg"></div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabListBtn" onclick="switchTab('list')">名单管理</button>
    <button class="tab-btn" id="tabAuditBtn" style="display:none" onclick="switchTab('audit')">审计记录</button>
  </div>

  <div id="panel-list">
    <div class="toolbar">
      <button class="primary" id="addBtn">+ 新增条目</button>
      <button id="batchDisableBtn" class="danger" disabled>批量停用</button>
      <button id="exportBtn">导出</button>
      <label style="font-size:0.82rem;display:flex;align-items:center;gap:4px;cursor:pointer">
        <input type="checkbox" id="showInactive" onchange="currentPage=1;renderTable()"> 显示已禁用
      </label>
      <span style="margin-left:auto;font-size:0.82rem;color:var(--text-dim)" id="countInfo">—</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:32px"><input type="checkbox" id="checkAll" title="全选本页"></th>
            <th>手机号</th><th>姓名</th><th>区域</th><th>管理范围</th><th>状态</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <div id="panel-audit" style="display:none">
    <div class="audit-filter">
      <input type="text" id="auditTarget" maxlength="11" placeholder="按目标手机号过滤（可空）">
      <button id="auditBtn" class="primary">查询</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>时间</th><th>操作</th><th>目标手机号</th><th>操作人</th><th>变更内容</th></tr>
        </thead>
        <tbody id="auditTbody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- 新增/编辑 Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="head"><span id="modalTitle">新增条目</span><span class="close" onclick="closeModal()">&times;</span></div>
    <div class="body">
      <div class="form-grid">
        <div>
          <label>管理范围 <span style="color:var(--bad)">*</span></label>
          <div class="choice-row" id="scopeChoices">
            <label class="choice"><input type="radio" name="fAdminLevel" value="省级"><span>省级</span></label>
            <label class="choice"><input type="radio" name="fAdminLevel" value="市级"><span>市级</span></label>
            <label class="choice"><input type="radio" name="fAdminLevel" value="区县"><span>区县</span></label>
            <label class="choice"><input type="radio" name="fAdminLevel" value="调查员"><span>调查员</span></label>
          </div>
        </div>
        <div>
          <label>账号类型 <span style="color:var(--bad)">*</span></label>
          <div class="choice-row" id="fSysRoleChoices">
            <label class="choice"><input type="radio" name="fSysRole" value="普通用户"><span>普通用户</span></label>
            <label class="choice"><input type="radio" name="fSysRole" value="业务管理员"><span>业务管理员</span></label>
            <label class="choice"><input type="radio" name="fSysRole" value="系统管理员"><span>系统管理员</span></label>
          </div>
          <div id="fSysRoleReadonly" class="hidden">
            <div class="readonly-box" id="fSysRoleReadonlyText">由系统自动设置</div>
          </div>
          <div class="field-hint" id="roleHint"></div>
        </div>
        <div class="form-row">
          <div>
            <label>手机号 <span style="color:var(--bad)">*</span></label>
            <input type="text" id="fPhone" maxlength="11" placeholder="13800000000">
            <div class="field-hint" id="phoneStatus"></div>
          </div>
          <div>
            <label>姓名 <span style="color:var(--bad)">*</span></label>
            <input type="text" id="fName" maxlength="20">
          </div>
        </div>
        <div>
          <label>区域</label>
          <div class="field-hint" id="regionHint"></div>
          <div class="region-grid">
            <div>
              <label>省</label>
              <input type="text" id="fProvince" value="贵州省" readonly>
            </div>
            <div class="field" id="field-city">
              <label>市/州 <span style="color:var(--bad)">*</span></label>
              <div class="search-select" id="select-city">
                <input type="text" id="search-city" placeholder="搜索市/州">
                <button type="button" class="search-toggle" onclick="document.getElementById('search-city').focus()">▾</button>
                <div class="search-menu" id="menu-city" role="listbox"></div>
              </div>
              <input type="hidden" id="fCity">
            </div>
            <div class="field" id="field-county">
              <label>县/区 <span style="color:var(--bad)">*</span></label>
              <div class="search-select" id="select-county">
                <input type="text" id="search-county" placeholder="搜索县/区">
                <button type="button" class="search-toggle" onclick="document.getElementById('search-county').focus()">▾</button>
                <div class="search-menu" id="menu-county" role="listbox"></div>
              </div>
              <input type="hidden" id="fCounty">
            </div>
            <div class="field" id="field-township">
              <label>乡镇/街道 <span style="color:var(--bad)">*</span></label>
              <div class="search-select" id="select-township">
                <input type="text" id="search-township" placeholder="搜索乡镇/街道">
                <button type="button" class="search-toggle" onclick="document.getElementById('search-township').focus()">▾</button>
                <div class="search-menu" id="menu-township" role="listbox"></div>
              </div>
              <input type="hidden" id="fTownship">
            </div>
            <div class="field" id="field-community">
              <label>社区/村 <span style="color:var(--bad)">*</span></label>
              <div class="search-select" id="select-community">
                <input type="text" id="search-community" placeholder="搜索社区/村">
                <button type="button" class="search-toggle" onclick="document.getElementById('search-community').focus()">▾</button>
                <div class="search-menu" id="menu-community" role="listbox"></div>
              </div>
              <input type="hidden" id="fCommunity">
            </div>
          </div>
          <div class="field-hint">没有对应调查点？反馈给系统管理员。</div>
        </div>
        <div>
          <label>备注</label>
          <input type="text" id="fRemark" maxlength="200" placeholder="可选">
        </div>
      </div>
    </div>
    <div class="foot">
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<footer>劳动力调查 AI 助手 · 白名单管理</footer>

<script src="/static/common.js"></script>
<script src="/static/whitelist-form.js"></script>
<script>
requireLoginOrRedirect();

let me = null;          // whoami 结果
let allItems = [];
let editPhone = null;
let currentPage = 1;
let pageSize = 20;
let checkedSet = new Set();   // 批量停用勾选
let detailOpenSet = new Set(); // 详情展开状态

async function initRole() {
  try {
    const r = await fetch('/api/admin/whitelist/whoami', { headers: authHeader() });
    if (await handle401(r)) return;
    if (r.status === 403) {
      showMsg('无白名单管理权限，即将返回首页', 'err');
      setTimeout(() => location.replace('/'), 1200);
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    me = await r.json();
    configureByRole();
    await initAdminNav('whitelist-admin', me);
    loadItems();
    if (isSystemAdmin()) loadAudit();
  } catch (e) {
    showMsg('身份探测失败：' + e.message, 'err');
  }
}

function isSystemAdmin() {
  return me && me.sys_role === '系统管理员';
}

function configureByRole() {
  const sys = isSystemAdmin();
  $('tabAuditBtn').style.display = sys ? '' : 'none';
  configureWhitelistForm();
  loadRegionCatalog().catch(() => {});
}

async function loadItems() {
  try {
    const r = await fetch('/api/admin/whitelist', { headers: authHeader() });
    if (await handle401(r)) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    allItems = (await r.json()).items || [];
    // 勾选集合只保留仍在列表中的号码
    const phones = new Set(allItems.map(x => x.phone));
    checkedSet = new Set(Array.from(checkedSet).filter(p => phones.has(p)));
    renderTable();
  } catch (e) {
    showMsg('加载失败：' + e.message, 'err');
  }
}

function showMsg(msg, type) {
  const el = $('msg');
  el.innerHTML = '<div class="msg ' + type + '">' + escapeHtml(msg) + '</div>';
  setTimeout(() => el.innerHTML = '', 5000);
}

function switchTab(name) {
  $('tabListBtn').classList.toggle('active', name === 'list');
  $('tabAuditBtn').classList.toggle('active', name === 'audit');
  $('panel-list').style.display = name === 'list' ? '' : 'none';
  $('panel-audit').style.display = name === 'audit' ? '' : 'none';
}

function renderTable() {
  const showInactive = $('showInactive').checked;
  const filtered = showInactive ? allItems : allItems.filter(r => r.active);
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * pageSize;
  const pageItems = filtered.slice(start, start + pageSize);
  $('countInfo').textContent = '共 ' + filtered.length + ' 条（总计 ' + allItems.length + ' 条）';
  $('tbody').innerHTML = pageItems.length === 0
    ? '<tr><td colspan="7" class="empty-row">暂无数据</td></tr>'
    : pageItems.map(r => {
    const cls = r.active ? 'main-row' : 'main-row inactive';
    const status = r.active ? '启用' : '已禁用';
    const enableBtn = r.active ? '' : '<button class="btn-sm" onclick="enableEntry(\'' + escapeHtml(r.phone) + '\')">启用</button> ';
    const checked = checkedSet.has(r.phone) ? ' checked' : '';
    const detailOpen = detailOpenSet.has(r.phone) ? ' open' : '';
    const region = (r.city || r.province || '') + (r.county ? ' · ' + r.county : '');
    const detailItems = [
      ['省', r.province], ['市/州', r.city], ['县/区', r.county], ['乡/镇', r.township || ''],
      ['社区/村', r.community], ['账号类型', r.sys_role || '普通用户'],
      ['更新时间', (r.updated_at || '').slice(0, 16)], ['备注', r.remark || '—'],
    ].map(x => '<span class="item"><b>' + escapeHtml(x[0]) + '</b>' + escapeHtml(x[1]) + '</span>').join('');
    return '<tr class="' + cls + '" data-phone="' + escapeHtml(r.phone) + '">' +
      '<td data-label=""><input type="checkbox" class="row-check" data-phone="' + escapeHtml(r.phone) + '"' + checked + '></td>' +
      '<td data-label="手机号">' + escapeHtml(r.phone) + '</td>' +
      '<td data-label="姓名">' + escapeHtml(r.name) + '</td>' +
      '<td data-label="区域">' + escapeHtml(region) + '</td>' +
    '<td data-label="管理范围">' + escapeHtml(r.admin_level || '调查员') + '</td>' +
      '<td data-label="状态">' + status + '</td>' +
      '<td data-label="操作">' +
        '<button class="btn-sm" data-detail="' + escapeHtml(r.phone) + '" onclick="toggleDetail(\'' + escapeHtml(r.phone) + '\')">' + (detailOpen ? '收起' : '详情') + '</button> ' +
        '<button class="btn-sm" onclick="editEntry(\'' + escapeHtml(r.phone) + '\')">编辑</button> ' +
        enableBtn +
        (r.active
          ? '<button class="btn-sm danger" onclick="removeEntry(\'' + escapeHtml(r.phone) + '\')">禁用</button>'
          : '') +
      '</td>' +
      '</tr>' +
      '<tr class="detail-row' + detailOpen + '" data-phone="' + escapeHtml(r.phone) + '">' +
        '<td colspan="7"><div class="detail-grid">' + detailItems + '</div></td>' +
      '</tr>';
  }).join('');
  renderPager(totalPages, filtered.length);
  bindRowChecks();
  updateBatchBtn();
}

function toggleDetail(phone) {
  const tr = document.querySelector('tr.detail-row[data-phone="' + CSS.escape(phone) + '"]');
  if (!tr) return;
  const open = tr.classList.contains('open');
  tr.classList.toggle('open');
  const btn = document.querySelector('button[data-detail="' + CSS.escape(phone) + '"]');
  if (btn) btn.textContent = open ? '详情' : '收起';
  if (open) detailOpenSet.delete(phone); else detailOpenSet.add(phone);
}

function bindRowChecks() {
  document.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) checkedSet.add(cb.dataset.phone);
      else checkedSet.delete(cb.dataset.phone);
      updateBatchBtn();
      const all = document.querySelectorAll('.row-check');
      $('checkAll').checked = all.length > 0 && Array.from(all).every(x => x.checked);
    });
  });
  const checkAll = $('checkAll');
  checkAll.onchange = () => {
    const all = document.querySelectorAll('.row-check');
    all.forEach(cb => {
      cb.checked = checkAll.checked;
      if (checkAll.checked) checkedSet.add(cb.dataset.phone);
      else checkedSet.delete(cb.dataset.phone);
    });
    updateBatchBtn();
  };
}

function updateBatchBtn() {
  const n = checkedSet.size;
  $('batchDisableBtn').disabled = n === 0;
  $('batchDisableBtn').textContent = '批量停用' + (n ? '（' + n + '）' : '');
}

async function batchDisable() {
  if (!checkedSet.size) return;
  if (!confirm('确认停用选中的 ' + checkedSet.size + ' 个账号？\n停用后立即无法登录。')) return;
  const phones = Array.from(checkedSet);
  try {
    const r = await fetch('/api/admin/whitelist/batch-disable', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeader() },
      body: JSON.stringify({ phones }),
    });
    if (await handle401(r)) return;
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: 'HTTP ' + r.status }));
      throw new Error(err.detail || 'HTTP ' + r.status);
    }
    const j = await r.json();
    let msg = '已停用 ' + j.disabled + ' 个';
    if (j.skipped && j.skipped.length) {
      msg += '；跳过 ' + j.skipped.map(s => s.phone + '（' + s.reason + '）').join('、');
    }
    showMsg(msg, j.skipped && j.skipped.length ? 'err' : 'ok');
    checkedSet.clear();
    loadItems();
  } catch (e) {
    showMsg('批量停用失败：' + e.message, 'err');
  }
}

async function enableEntry(phone) {
  try {
    const r = await fetch('/api/admin/whitelist/' + encodeURIComponent(phone) + '/enable', {
      method: 'PATCH', headers: authHeader(),
    });
    if (await handle401(r)) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    showMsg('已启用 ' + phone.slice(0, 3) + '****', 'ok');
    loadItems();
  } catch (e) {
    showMsg('启用失败：' + e.message, 'err');
  }
}

function renderPager(totalPages, totalItems) {
  const p = $('pager');
  if (totalItems === 0) { p.innerHTML = ''; p.style.display = 'none'; return; }
  const from = (currentPage - 1) * pageSize + 1;
  const to = Math.min(currentPage * pageSize, totalItems);
  const pages = buildPageList(currentPage, totalPages);
  const pageOpts = [20,50,100].map(function(n){
    return '<option value="' + n + '"' + (n===pageSize?' selected':'') + '>' + n + '</option>';
  }).join('');
  const pageBtns = pages.map(function(x){
    return x === '...'
      ? '<span class="ellipsis">…</span>'
      : '<button class="' + (x===currentPage?'active':'') + '" onclick="goPage(' + x + ')">' + x + '</button>';
  }).join('');
  p.style.display = 'flex';
  p.innerHTML =
    '<span>每页 <select onchange="pageSize=parseInt(this.value,10);currentPage=1;renderTable()">' + pageOpts + '</select> 条</span>' +
    '<span>第 ' + from + '-' + to + ' 条 / 共 ' + totalItems + ' 条</span>' +
    '<span class="pages">' +
    '<button onclick="goPage(1)" ' + (currentPage===1?'disabled':'') + '>«</button>' +
    '<button onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage===1?'disabled':'') + '>‹</button>' +
    pageBtns +
    '<button onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage===totalPages?'disabled':'') + '>›</button>' +
    '<button onclick="goPage(' + totalPages + ')" ' + (currentPage===totalPages?'disabled':'') + '>»</button>' +
    '</span>';
}

function buildPageList(current, totalPages) {
  const out = [];
  const set = new Set([1, totalPages, current, current-1, current+1, current-2, current+2]);
  const sorted = Array.from(set).filter(function(n){ return n >= 1 && n <= totalPages; }).sort(function(a,b){ return a-b; });
  let prev = 0;
  for (const n of sorted) {
    if (n - prev > 1 && prev !== 0) out.push('...');
    out.push(n);
    prev = n;
  }
  return out;
}

function goPage(n) {
  if (!Number.isFinite(n)) n = 1;
  const showInactive = $('showInactive').checked;
  const total = showInactive ? allItems.length : allItems.filter(function(r){ return r.active; }).length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (n < 1) n = 1;
  if (n > totalPages) n = totalPages;
  currentPage = n;
  renderTable();
}

function editEntry(phone) {
  const entry = allItems.find(r => r.phone === phone);
  if (entry) prepareEntryModal('编辑条目', entry);
}

async function removeEntry(phone) {
  if (!confirm('确认禁用 ' + phone + '？\n禁用后该用户将无法登录。')) return;
  try {
    const r = await fetch('/api/admin/whitelist/' + encodeURIComponent(phone), {
      method: 'DELETE', headers: authHeader(),
    });
    if (await handle401(r)) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    showMsg('已禁用 ' + phone.slice(0, 3) + '****', 'ok');
    loadItems();
  } catch (e) {
    showMsg('禁用失败：' + e.message, 'err');
  }
}

// --- 导出 --------------------------------------------------------------------

async function exportList() {
  try {
    const r = await fetch('/api/admin/whitelist/export', { headers: authHeader() });
    if (await handle401(r)) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const ext = (me.admin_level === '区县' && !isSystemAdmin()) ? 'csv' : 'xlsx';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '白名单导出_' + new Date().toISOString().slice(0, 10) + '.' + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showMsg('已导出 ' + ext.toUpperCase(), 'ok');
  } catch (e) {
    showMsg('导出失败：' + e.message, 'err');
  }
}

// --- 审计（仅系统管理员） --------------------------------------------------------

async function loadAudit() {
  const target = $('auditTarget').value.trim();
  const url = '/api/admin/whitelist/audit?limit=100' + (target ? '&target_phone=' + encodeURIComponent(target) : '');
  try {
    const r = await fetch(url, { headers: authHeader() });
    if (await handle401(r)) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const ACTIONS = {
      create: '新增', update: '编辑', disable: '停用', enable: '启用',
      batch_disable: '批量停用', sys_role_change: '角色变更', import: 'CSV 导入',
    };
    $('auditTbody').innerHTML = (j.items || []).length === 0
      ? '<tr><td colspan="5" class="empty-row">暂无审计记录</td></tr>'
      : j.items.map(a => {
        const diff = [];
        if (a.before_json) {
          try { diff.push('前:' + JSON.stringify(JSON.parse(a.before_json)).slice(0, 120)); } catch (e) { diff.push('前:?'); }
        }
        if (a.after_json) {
          try { diff.push('后:' + JSON.stringify(JSON.parse(a.after_json)).slice(0, 120)); } catch (e) { diff.push('后:?'); }
        }
        return '<tr>' +
          '<td>' + escapeHtml((a.created_at || '').slice(0, 19)) + '</td>' +
          '<td>' + escapeHtml(ACTIONS[a.action] || a.action) + '</td>' +
          '<td>' + escapeHtml(a.target_phone) + '</td>' +
          '<td>' + escapeHtml(a.actor_phone || '') + (a.actor_name ? ' ' + escapeHtml(a.actor_name) : '') + '</td>' +
          '<td style="white-space:normal;word-break:break-all;max-width:360px">' + escapeHtml(diff.join(' ')) + '</td>' +
          '</tr>';
      }).join('');
  } catch (e) {
    showMsg('审计加载失败：' + e.message, 'err');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
$('addBtn').onclick = () => prepareEntryModal('新增条目');
$('exportBtn').onclick = exportList;
$('batchDisableBtn').onclick = batchDisable;
$('auditBtn').onclick = loadAudit;
$('editModal').addEventListener('click', (e) => {
  if (e.target === $('editModal')) closeModal();
});

initRole();
</script>
</body>
